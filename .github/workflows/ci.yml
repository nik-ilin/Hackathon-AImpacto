name: NexoLab quality
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
  supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:start
      - run: npm run db:reset
      - run: npm run test:db
      - run: npx supabase db lint --local --level warning --fail-on warning
      - run: npx supabase db advisors --local --type security --level warn --fail-on error
      - run: npm run test:concurrency
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:local
      - if: always()
        run: npx supabase stop --no-backup
