name: NexoLab quality
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix agents/judy
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.6"
      - run: npm run typecheck:edge
      - run: npm run typecheck:judy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:judy
      - run: npm run build
  supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix agents/judy
      - run: npm run db:start
      - run: npm run db:reset
      - run: npm run test:db
      - run: npm run test:db:types
      - run: npx supabase db lint --local --level warning --fail-on warning
      - run: npx supabase db advisors --local --type security --level warn --fail-on error
      - run: npm run test:concurrency
      - run: npm run test:integration
      - run: npm run test:catalog:integration
      - run: npm run test:catalog:concurrency
      - run: npm run test:edge:local
      - run: npx playwright install --with-deps chromium
        if: ${{ !cancelled() }}
      - run: npm run test:e2e:local
        if: ${{ !cancelled() }}
      - name: Upload safe E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-safe-diagnostics
          path: |
            test-results/**/safe-diagnostics.json
            test-results/**/safe-edge-diagnostics.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload generated schema contract
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-generated-types
          path: .local/generated/database.ts
          if-no-files-found: ignore
          retention-days: 7
      - if: always()
        run: npx supabase stop --no-backup
